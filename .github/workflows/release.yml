name: Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate release summary
        run: node .github/scripts/validate-release-summary.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Compile and Package Electron App
        # --publish never: packaging only. Artifact upload is handled below.
        # latest.yml + .blockmap are required by electron-updater.
        run: npm run build && npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Build Artifacts to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: CyberNotes-Windows-Installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Prepare Release Notes & Scan with VirusTotal
        id: virustotal
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $installerItem = Get-ChildItem -Path "./release" -Filter "CyberNotes_Setup_*.exe" | Select-Object -First 1
          $portableItem = Get-ChildItem -Path "./release" -Filter "CyberNotes_Portable_*.exe" | Select-Object -First 1
          if (-not $installerItem) {
            throw "Setup installer .exe not found in ./release"
          }
          if (-not $portableItem) {
            throw "Portable .exe not found in ./release"
          }

          $installerPath = $installerItem.FullName
          $portablePath = $portableItem.FullName
          $installerHash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLower()
          $portableHash = (Get-FileHash $portablePath -Algorithm SHA256).Hash.ToLower()
          $rawVersion = "${{ github.ref_name }}".TrimStart('v')

          Write-Host "Installer: $($installerItem.Name)"
          Write-Host "Installer SHA256: $installerHash"
          Write-Host "Portable: $($portableItem.Name)"
          Write-Host "Portable SHA256: $portableHash"
          Write-Host "Raw Version: $rawVersion"

          if ($env:VIRUSTOTAL_API_KEY) {
            function Upload-VirusTotal($filePath, $apiKey) {
              $item = Get-Item $filePath
              $sizeMb = [Math]::Round($item.Length / 1MB, 2)
              Write-Host "Uploading $filePath ($sizeMb MB) to VirusTotal..."
              $headers = @{ "x-apikey" = $apiKey }
              $url = "https://www.virustotal.com/api/v3/files"

              if ($item.Length -gt 30MB) {
                Write-Host "File exceeds 30MB ($sizeMb MB), requesting dedicated large-file upload endpoint from VirusTotal..."
                $urlResp = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Method Get -Headers $headers -TimeoutSec 60
                $url = $urlResp.data
                Write-Host "Using dedicated endpoint: $url"
              }

              $resp = & curl.exe -s -S --fail -X POST -H "x-apikey: $apiKey" -F "file=@$filePath" "$url"
              Write-Host "Upload successful. Response: $resp"
            }

            try {
              Upload-VirusTotal $installerPath $env:VIRUSTOTAL_API_KEY
            } catch {
              Write-Warning "VirusTotal installer upload warning: $_"
            }

            try {
              Upload-VirusTotal $portablePath $env:VIRUSTOTAL_API_KEY
            } catch {
              Write-Warning "VirusTotal portable upload warning: $_"
            }
          } else {
            Write-Host "VIRUSTOTAL_API_KEY secret not found; skipping direct upload and using computed SHA256 hashes for reports."
          }

          $template = [System.IO.File]::ReadAllText(".github/release-template.md", [System.Text.Encoding]::UTF8)
          $notes = $template.Replace("{{VERSION}}", "${{ github.ref_name }}").Replace("{{RAW_VERSION}}", $rawVersion).Replace("{{INSTALLER_HASH}}", $installerHash).Replace("{{PORTABLE_HASH}}", $portableHash)
          [System.IO.File]::WriteAllText("release_notes.md", $notes, [System.Text.Encoding]::UTF8)

      - name: Upload GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "CyberNotes ${{ github.ref_name }}"
          draft: true
          prerelease: false
          body_path: ./release_notes.md
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Final guard: action-gh-release can keep an existing draft body and has
      # been observed to publish even with draft: true. Apply notes and re-assert draft.
      - name: Apply release notes and force draft
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release edit $tag --notes-file ./release_notes.md --draft
          $state = gh release view $tag --json isDraft --jq .isDraft
          if ($state -ne "true") {
            throw "Failed to force $tag back to draft (isDraft=$state)"
          }
          Write-Host "Release $tag confirmed as draft with filled notes."
