ShortDescription: Flexible local note-taking for Windows
Description: CyberNotes is a flexible writing space for Windows that keeps your notes on your device without an account or built-in cloud sync. Capture quick thoughts or build longer documents with formatting, lists, code and images. Colorful folders, tabs, favorites and full-text search help you return to an idea, while floating notes keep a reference in view as you work. Autosave and session restore help you pick up where you left off, and scheduled backups to a folder you choose keep notes and images safe. An optional password or PIN locks access to the app; the stored notes themselves are not encrypted. Built with Electron.
